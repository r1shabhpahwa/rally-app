{{define "admin.html"}}<!-- organizer layout -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Badminton</title>
<link rel="stylesheet" href="/static/app.css?v={{.AssetV}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🏸</text></svg>">
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">🏸 Badminton</a>
    <nav>
      <a href="/" class="{{if eq .Page "sessions"}}on{{end}}">Sessions</a>
      <a href="/players" class="{{if eq .Page "players"}}on{{end}}">Mailing list</a>
      <a href="/outbox" class="{{if eq .Page "outbox"}}on{{end}}">Email{{if .PendingMail}} <span class="dot">{{.PendingMail}}</span>{{end}}</a>
      <a href="/settings" class="{{if eq .Page "settings"}}on{{end}}">Settings</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button class="linkish" type="submit">Sign out</button>
      </form>
    </nav>
  </div>
</header>
<main class="wrap">
  {{with .Flash}}<div class="flash {{if .IsError}}flash-error{{else}}flash-ok{{end}}">{{.Message}}</div>{{end}}
  {{template "content" .}}
</main>
<script src="/static/app.js?v={{.AssetV}}"></script>
{{end}}
